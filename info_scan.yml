name: info_scan

on:
  schedule:
    - cron: '40 11 * * 1-5'      # 한국시간 20:40 (평일, scan 끝난 뒤)
  workflow_dispatch:
    inputs:
      probe_only:
        description: '주소 시험 결과만 보려면 1 (저장 안 함)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  info_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Info scan
        run: python info_scan.py
        env:
          PROBE_ONLY: ${{ github.event.inputs.probe_only }}

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "info_scan $(TZ=Asia/Seoul date +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi
