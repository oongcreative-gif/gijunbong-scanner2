name: backfill

on:
  workflow_dispatch:
    inputs:
      date_from:
        description: '채울 시작일 (YYYY-MM-DD)'
        required: true
        default: '2026-08-01'
        type: string
      date_to:
        description: '채울 종료일 (YYYY-MM-DD)'
        required: true
        default: '2026-10-21'
        type: string

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Backfill
        run: python backfill.py
        env:
          BACKFILL_FROM: ${{ github.event.inputs.date_from }}
          BACKFILL_TO: ${{ github.event.inputs.date_to }}

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "backfill $(TZ=Asia/Seoul date +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi
