name: diagnose

on:
  workflow_dispatch:
    inputs:
      codes:
        description: '종목명 또는 6자리 코드 (쉼표로 구분)'
        required: true
        default: 'GST, 쏘닉스, 코세스'
        type: string

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Diagnose
        run: python diagnose.py
        env:
          CODES: ${{ github.event.inputs.codes }}
